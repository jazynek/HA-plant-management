      required: true
      example: "Monstera deliciosa"
      selector:
        text:
    species:
      selector:
        text:
    zone:
      selector:
        text:
    light_zone:
      selector:
        text:
    watering_interval_days:
      selector:
        number:
          min: 1
          max: 120
    fertilizing_interval_days:
      selector:
        number:
          min: 1
          max: 365
    light_notes:
      selector:
        text:
    watering_notes:
      selector:
        text:
    fertilizing_notes:
      selector:
        text:
    care_notes:
      selector:
        text:
    photo:
